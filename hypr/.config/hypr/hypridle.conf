# Goes through quickshell's own "lock" IPC target rather than spawning
# hyprlock directly, so idle-timeout/suspend locking uses the same
# screen (and respects lock.useHyprlock in config.json) as the manual
# lock keybind already does — previously these two paths diverged and
# showed different lock screens depending on how you triggered them.
$lock_cmd = qs -c ii ipc call lock activate
$suspend_cmd = systemctl suspend || loginctl suspend

# See idle_gate.sh — the bar's "Awake" toggle sets a Wayland idle-inhibitor
# that should already stop these timeouts from firing at all, but in
# practice the screen still locked/slept with Awake on, so every timeout
# action below is routed through this explicit, guaranteed-correct check
# of the same awake-state the toggle persists to disk.
$gate = ~/.config/hypr/hyprland/scripts/idle_gate.sh

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $gate loginctl lock-session
    after_sleep_cmd = $lock_cmd
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = $gate loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = $gate hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900 # 15mins
    on-timeout = $gate sh -c '$suspend_cmd'
}
