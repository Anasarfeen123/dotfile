# ==============================================================================
# HYPRLOCK MATERIAL 3 GLASSMORPHIC LOCKSCREEN (PIXEL / ANDROID 15 EDITION)
# ==============================================================================

source = ~/.config/hypr/hyprlock/colors.conf

# ------------------------------------------------------------------------------
# BACKGROUND & DEEP BLUR (wallpaper depth)
# ------------------------------------------------------------------------------
background {
    monitor =
    path = $background_image
    blur_passes = 4
    blur_size = 14
    noise = 0.0117
    contrast = 0.92
    brightness = 0.60
    vibrancy = 0.40
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------------------------
# GENERAL CONFIG
# ------------------------------------------------------------------------------
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# ------------------------------------------------------------------------------
# MATERIAL 3 ANALOGUE CLOCK (HERO)
# ------------------------------------------------------------------------------
image {
    monitor =
    path = /tmp/hyprlock_analog_clock.png
    reload_time = 1
    reload_cmd = python3 /home/anasa/.config/hypr/hyprlock/render_analog_clock.py
    size = 320
    border_size = 0
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, -190
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# DIGITAL TIME + DATE FROSTED PILL
# ------------------------------------------------------------------------------
shape {
    monitor =
    size = 340, 110
    rounding = -1
    color = $surface_container_color
    border_size = 1
    border_color = $entry_border_color
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 55
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 36
    font_family = $font_family_clock
    position = 0, 32
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = $entry_color
    font_size = 14
    font_family = $font_family
    position = 0, 75
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# IDENTITY FROSTED CARD (avatar + name)
# ------------------------------------------------------------------------------
shape {
    monitor =
    size = 320, 160
    rounding = 28
    color = $surface_container_color
    border_size = 1
    border_color = $entry_border_color
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 210
    halign = center
    valign = center
}
image {
    monitor =
    path = /home/anasa/.face
    size = 104
    border_size = 3
    border_color = $entry_border_color
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 0, 200
    halign = center
    valign = center
}
label {
    monitor =
    text = Anas Arfeen • Hyprland Desktop
    color = $text_color
    font_size = 15
    font_family = $font_family
    position = 0, 255
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# CAPSULE PASSWORD INPUT BOX
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 310, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $surface_container_color
    font_color = $entry_color
    check_color = $primary_color
    fail_color = $error_color
    capslock_color = $warning_color
    fade_on_empty = false
    placeholder_text = <i><span foreground="##dfe5cd">Enter Password...</span></i>
    hide_input = false
    position = 0, 350
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# MEDIA PLAYER CARD (TOP RIGHT)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] bash -c 'info=$(playerctl metadata --format "󰎈 {{title}} • {{artist}}" 2>/dev/null); if [ -n "$info" ]; then echo "$info"; else echo ""; fi'
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = -35, -35
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ------------------------------------------------------------------------------
# BATTERY & SYSTEM UPTIME CARD (BOTTOM LEFT)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] bash -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null); status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null); if [ -n "$cap" ]; then echo "󰁹 ${cap}% (${status}) | Up $(uptime -p | sed "s/up //")"; else echo "󰌢 Up $(uptime -p | sed "s/up //")"; fi'
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 35, 35
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ------------------------------------------------------------------------------
# HARDWARE THERMALS & DIAGNOSTICS (BOTTOM RIGHT)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] bash -c 'cpu_temp=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | awk "{print int(\$1/1000)}"); gpu_temp=$(nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null); if [ -n "$cpu_temp" ]; then echo "󰔏 CPU: ${cpu_temp}°C | GPU: ${gpu_temp:-N/A}°C"; else echo ""; fi'
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = -35, 35
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ------------------------------------------------------------------------------
# INSPIRATION QUOTE (BOTTOM CENTER)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = <i>"Work Hard in Silence, Let Success Make the Noise"</i>
    color = $entry_border_color
    font_size = 12
    font_family = $font_family
    position = 0, 35
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}
