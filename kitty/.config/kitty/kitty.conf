# Theme - Generated from wallpaper via quickshell
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# Cursor
cursor_shape          beam
cursor_trail          1
cursor_beam_thickness 1.5

# Layout
window_padding_width  4
window_margin_width   4
hide_window_decorations yes

# Transparency
background_opacity 0.92
background_blur    24
dynamic_background_opacity yes
map super+shift+e set_background_opacity 1.0
map super+shift+d set_background_opacity 0.65

# No stupid close confirmation
confirm_os_window_close 0

# Shell
shell fish

# Selection
select_by_word_characters @:./-_

# Scrollback
scrollback_lines 10000
wheel_scroll_min_lines 1

# Bell
enable_audio_bell no

# Copy & Paste
map ctrl+c         copy_or_interrupt
map ctrl+v         paste_from_clipboard
map ctrl+shift+c   copy_to_clipboard
map ctrl+shift+v   paste_from_clipboard

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up       scroll_page_up
map page_down     scroll_page_down

map ctrl+plus     change_font_size all +1
map ctrl+equal    change_font_size all +1
map ctrl+kp_add   change_font_size all +1
map ctrl+minus    change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0        change_font_size all 0
map ctrl+kp_0     change_font_size all 0

# URL hints
map kitty_mod+e   open_url_with_hints

# Tab bar
tab_bar_style               powerline
tab_bar_edge                bottom
tab_bar_margin_width        0.0

# Tab keybindings
map ctrl+shift+t            new_tab
map ctrl+tab                next_tab
map ctrl+shift+tab          previous_tab
map ctrl+shift+q            close_tab
map ctrl+shift+1            goto_tab 1
map ctrl+shift+2            goto_tab 2
map ctrl+shift+3            goto_tab 3
map ctrl+shift+4            goto_tab 4
map ctrl+shift+5            goto_tab 5
map ctrl+shift+6            goto_tab 6
map ctrl+shift+7            goto_tab 7
map ctrl+shift+8            goto_tab 8
map ctrl+shift+9            goto_tab 9

# Window management
map ctrl+shift+enter        new_window
map ctrl+shift+right        next_window
map ctrl+shift+left         previous_window
